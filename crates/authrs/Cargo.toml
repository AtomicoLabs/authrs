[package]
name = "authrs"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Human login for axum: passwords, email, magic links, OTP, OAuth, TOTP, and passkeys."
readme = "../../README.md"
keywords = ["authentication", "axum", "oauth", "webauthn", "jwt"]
categories = ["authentication", "web-programming"]

[features]
default = ["testkit"]
testkit = []

[dependencies]
aes-gcm = "0.10"
anyhow = "1"
argon2 = "0.5"
async-trait = "0.1"
authrs-store = { path = "../authrs-store" }
axum = "0.8"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
ed25519-dalek = { version = "2", features = ["pkcs8"] }
hex = "0.4"
jsonwebtoken = { version = "9", default-features = false, features = ["use_pem"] }
pkcs8 = { version = "0.10", features = ["pem"] }
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
totp-rs = { version = "5", features = ["gen_secret", "otpauth"] }
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
webauthn-rs = { version = "0.5", features = ["danger-allow-state-serialisation"] }
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "rustls-tls"] }

[dev-dependencies]
webauthn-authenticator-rs = { version = "0.5", features = ["softpasskey"] }
axum = "0.8"
http-body-util = "0.1"
p256 = { version = "0.13", features = ["ecdsa", "pkcs8"] }
pkcs8 = { version = "0.10", features = ["pem"] }
serde_json = "1"
tempfile = "3"
testcontainers = "0.23"
testcontainers-modules = { version = "0.11", features = ["postgres"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tower = { version = "0.5", features = ["util"] }
authrs-store-postgres = { path = "../authrs-store-postgres" }
authrs-store-sqlite = { path = "../authrs-store-sqlite" }
wiremock = "0.6"
